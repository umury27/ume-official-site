name: Update Shorts list

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch recent Shorts candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_shorts.py
      - name: Commit refreshed list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shorts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Shorts candidates'
            git push
          fi
